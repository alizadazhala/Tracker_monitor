function colorForZ(z){
  if(z===null||z===undefined) return 'var(--neutral)';
  if(z>=2) return 'var(--up)';
  if(z<=-2) return 'var(--down)';
  if(z>0.5) return '#8fd9b8';
  if(z<-0.5) return '#f0a3a5';
  return 'var(--neutral)';
}
function signalLabel(z){
  if(z===null||z===undefined) return {text:'NO SIGNAL', color:'var(--neutral)'};
  if(z>=2) return {text:'STRONG POSITIVE DRIFT', color:'var(--up)'};
  if(z<=-2) return {text:'STRONG NEGATIVE DRIFT', color:'var(--down)'};
  if(z>0.75) return {text:'MILD POSITIVE DRIFT', color:'#8fd9b8'};
  if(z<-0.75) return {text:'MILD NEGATIVE DRIFT', color:'#f0a3a5'};
  return {text:'ALIGNED WITH MODEL', color:'var(--neutral)'};
}
function fmt(v, dp=2, suffix=''){ return (v===null||v===undefined) ? '—' : v.toFixed(dp)+suffix; }

const SEGMENT_CATEGORY = {
  'Integrated Major':'Oil & Gas Majors', 'Upstream O&G':'Oil & Gas Majors', 'Refining':'Oil & Gas Majors',
  'Offshore Services':'Oilfield Services & Equipment', 'Oilfield Services':'Oilfield Services & Equipment',

  'Renewable Fuels':'Renewables & Renewable Fuels',
};
const CATEGORY_ORDER = ['Oil & Gas Majors','Oilfield Services & Equipment','Gas & Storage Infrastructure','Renewables & Renewable Fuels'];

function rosterOrder(snapshot){
  return snapshot.slice().sort((a,b) => {
    if(a.country !== b.country) return a.country.localeCompare(b.country);
    const catA = CATEGORY_ORDER.indexOf(SEGMENT_CATEGORY[a.segment] || 'Other');
    const catB = CATEGORY_ORDER.indexOf(SEGMENT_CATEGORY[b.segment] || 'Other');
    if(catA !== catB) return catA - catB;
    return a.name.localeCompare(b.name);
  });
}

function buildSidebar(){
  const ordered = rosterOrder(DATA.snapshot);
  let lastCountry = null, lastCategory = null;
  let html = '';
  ordered.forEach(f => {
    const category = SEGMENT_CATEGORY[f.segment] || 'Other';
    if(f.country !== lastCountry){
      html += `<div class="sidebar-country-header">${f.country}</div>`;
      lastCountry = f.country; lastCategory = null;
    }
    if(category !== lastCategory){
      html += `<div class="sidebar-category-header">${category}</div>`;
      lastCategory = category;
    }
    html += `
    <div class="firm-row" data-ticker="${f.ticker} Equity" id="row-${f.ticker.replace(/[^a-zA-Z0-9]/g,'')}">
      <div>
        <div class="fname">${f.name}</div>
        <div class="fsub">${f.ticker} · ${f.segment}</div>
      </div>
      <span class="zbadge" style="color:${colorForZ(f.z)}; border:1px solid ${colorForZ(f.z)}44;">${f.z===null?'—':(f.z>0?'+':'')+f.z.toFixed(1)}</span>
    </div>`;
  });
  firmListEl.innerHTML = html;
}
buildSidebar();

function computeHistStats(ticker){
  const s = DATA.series[ticker];
  const p = s.price.filter(v => v !== null && v !== undefined);
  if(p.length < 30) return { totalReturn:null, sharpe:null };
  const rets = [];
  for(let i=1;i<p.length;i++){
    if(p[i-1] > 0 && p[i] > 0) rets.push(Math.log(p[i]/p[i-1]));
  }
  const n = rets.length;
  const mean = rets.reduce((a,b)=>a+b,0)/n;
  const variance = rets.reduce((a,b)=>a+(b-mean)*(b-mean),0)/(n-1);
  const std = Math.sqrt(variance);
  const sharpe = std > 0 ? (mean*252)/(std*Math.sqrt(252)) : null;
  const totalReturn = (p[p.length-1]/p[0] - 1) * 100;
  return { totalReturn, sharpe };
}
const HIST_STATS = {};
Object.keys(DATA.series).forEach(t => { HIST_STATS[t] = computeHistStats(t); });

const rankBody = document.getElementById('rankBody');
let rankSortKey = 'z';
function buildRank(){
  const rows = DATA.snapshot.map(f => Object.assign({}, f, HIST_STATS[f.ticker+' Equity']));
  if(rankSortKey === 'totalReturn'){
    rows.sort((a,b)=> (b.totalReturn??-Infinity) - (a.totalReturn??-Infinity));
  } else if(rankSortKey === 'sharpe'){
    rows.sort((a,b)=> (b.sharpe??-Infinity) - (a.sharpe??-Infinity));
  } else {
    rows.sort((a,b)=> (Math.abs(b.z??-1)) - (Math.abs(a.z??-1)));
  }
  rankBody.innerHTML = rows.map((f,i) => `
    <tr data-ticker="${f.ticker} Equity" id="tr-${f.ticker.replace(/[^a-zA-Z0-9]/g,'')}">
      <td class="rank-num">${i+1}</td>
      <td class="name">${f.name} <span style="color:var(--ink-faint)">${f.ticker}</span></td>
      <td>${f.segment}</td>
      <td class="num">${f.price===null?'—':f.price}</td>
      <td class="num">${f.pe===null?(f.priceOnly?'n/a*':'—'):f.pe}</td>
      <td class="num" style="color:${(f.totalReturn??0)>=0?'var(--up)':'var(--down)'}">${f.totalReturn==null?'—':(f.totalReturn>0?'+':'')+f.totalReturn.toFixed(0)+'%'}</td>
      <td class="num" style="color:${(f.sharpe??0)>=0?'var(--up)':'var(--down)'}; font-weight:600;">${f.sharpe==null?'—':f.sharpe.toFixed(2)}</td>

}

// LIVE FORMULA CALCULATION (rolling 120d market model vs SXEP)
// ============================================================
function computeLiveFormula(ticker){
  const s = DATA.series[ticker];
  const masterIdx = DATA.dates.length;
  // build log returns aligned to master date index for both firm price and SXEP
  const priceFull = new Array(masterIdx).fill(null);
  for(let i=0;i<s.price.length;i++){ priceFull[s.startIdx+i] = s.price[i]; }

  const WINDOW = 120; // matches dissertation Section 3.3.2: [-130,-11] estimation window = 120 trading days
  const end = masterIdx - 1;
  const start = Math.max(1, end - WINDOW + 1);
  const riArr = [], rmArr = [];
  for(let t=start; t<=end; t++){
    const p0 = priceFull[t-1], p1 = priceFull[t];
    const m0 = DATA.sxep[t-1], m1 = DATA.sxep[t];
    if(p0>0 && p1>0 && m0>0 && m1>0){
      riArr.push(Math.log(p1/p0));
      rmArr.push(Math.log(m1/m0));
    }
  }
  if(riArr.length < 30) return null;
  const n = riArr.length;
  const meanRi = riArr.reduce((a,b)=>a+b,0)/n;
  const meanRm = rmArr.reduce((a,b)=>a+b,0)/n;
  let cov=0, varM=0;
  for(let i=0;i<n;i++){ cov += (riArr[i]-meanRi)*(rmArr[i]-meanRm); varM += (rmArr[i]-meanRm)**2; }
  const beta = varM>0 ? cov/varM : null;
  const alpha = beta!==null ? meanRi - beta*meanRm : null;

  const lastRi = riArr[riArr.length-1];
  const lastRm = rmArr[rmArr.length-1];
  const lastAR = (beta!==null) ? lastRi - (alpha + beta*lastRm) : null;

  const arSeries = (beta!==null) ? riArr.map((ri,i) => ri - (alpha + beta*rmArr[i])) : [];

  return { beta, alpha, lastRi, lastRm, lastAR, arSeries, n };
}

// ============================================================
// CHART PATTERN DETECTION (swing highs/lows, S/R, breakouts)
// ============================================================
function findSwingPoints(weekly, lookback=3){
  const h = weekly.h, l = weekly.l, n = h.length;
  const highs = [], lows = [];
  for(let i=lookback; i<n-lookback; i++){
    let isHigh = true, isLow = true;
    for(let k=1; k<=lookback; k++){
      if(h[i] < h[i-k] || h[i] < h[i+k]) isHigh = false;
      if(l[i] > l[i-k] || l[i] > l[i+k]) isLow = false;
    }
    if(isHigh) highs.push(i);
    if(isLow) lows.push(i);
  }
  return { highs, lows };
}

function detectPattern(weekly){
  const n = weekly.c.length;
  if(n < 12) return null;
  const window = Math.min(26, n); // last ~6 months of weekly bars
  const start = n - window;
  const wSlice = {
    o: weekly.o.slice(start), h: weekly.h.slice(start), l: weekly.l.slice(start), c: weekly.c.slice(start),
  };
  const { highs, lows } = findSwingPoints(wSlice, 2);
  if(highs.length === 0 || lows.length === 0) return null;

  const resistance = Math.max(...highs.map(i => wSlice.h[i]));
  const support = Math.min(...lows.map(i => wSlice.l[i]));
  const lastClose = wSlice.c[wSlice.c.length-1];
  const prevClose = wSlice.c[wSlice.c.length-2] ?? lastClose;

  let signal = 'inside_range';
  if(lastClose > resistance && prevClose <= resistance) signal = 'resistance_breakout';
  else if(lastClose < support && prevClose >= support) signal = 'support_breakdown';
  else if(lastClose > resistance) signal = 'above_resistance';
  else if(lastClose < support) signal = 'below_support';

  // simple double-top / double-bottom: two highs (or lows) within 2% of each other, separated by a trough/peak
  let doublePattern = null;
  if(highs.length >= 2){
    const h1 = highs[highs.length-2], h2 = highs[highs.length-1];
    const v1 = wSlice.h[h1], v2 = wSlice.h[h2];
    if(Math.abs(v1-v2)/((v1+v2)/2) < 0.025 && (h2-h1) >= 3){
      doublePattern = { type:'double_top', levels:[h1,h2], value:(v1+v2)/2 };
    }
  }
  if(!doublePattern && lows.length >= 2){
    const l1 = lows[lows.length-2], l2 = lows[lows.length-1];
    const v1 = wSlice.l[l1], v2 = wSlice.l[l2];
    if(Math.abs(v1-v2)/((v1+v2)/2) < 0.025 && (l2-l1) >= 3){
      doublePattern = { type:'double_bottom', levels:[l1,l2], value:(v1+v2)/2 };
    }
  }

  // Fibonacci retracement grid across the same high/low range used for S/R
  const fibLevels = [0, 0.236, 0.382, 0.5, 0.618, 0.786, 1].map(pct => ({
    pct, value: support + pct * (resistance - support)
  }));

  const trendlines = detectTrendlines(wSlice, highs, lows);

  return { resistance, support, signal, doublePattern, offset:start, highs, lows, fibLevels, trendlines };
}

function linreg(xs, ys){
  const n = xs.length;
  const xm = xs.reduce((a,b)=>a+b,0)/n, ym = ys.reduce((a,b)=>a+b,0)/n;
  let num=0, den=0;
  for(let i=0;i<n;i++){ num += (xs[i]-xm)*(ys[i]-ym); den += (xs[i]-xm)**2; }
  const slope = den>0 ? num/den : 0;
  const intercept = ym - slope*xm;
  return { slope, intercept };
}

// Fits a line through the swing highs (upper boundary) and one through the swing lows (lower
// boundary), then classifies the geometry as a parallel channel, a triangle/wedge, or neither —
// mirroring how a technician draws two trendlines by hand (Kirkpatrick & Dow; Nison, Ch.13).
function detectTrendlines(wSlice, highs, lows){
  if(highs.length < 2 || lows.length < 2) return null;
  const upperFit = linreg(highs, highs.map(i=>wSlice.h[i]));
  const lowerFit = linreg(lows, lows.map(i=>wSlice.l[i]));
  const avgPrice = (wSlice.h.reduce((a,b)=>a+b,0) + wSlice.l.reduce((a,b)=>a+b,0)) / (wSlice.h.length + wSlice.l.length);
  const upperPct = upperFit.slope / avgPrice, lowerPct = lowerFit.slope / avgPrice;
  const FLAT = 0.0012; // ~0.12% per weekly bar treated as "flat"
  const upperFlat = Math.abs(upperPct) < FLAT, lowerFlat = Math.abs(lowerPct) < FLAT;

  let type = null, label = null, explain = null;
  if(!upperFlat && !lowerFlat && Math.sign(upperPct)===Math.sign(lowerPct) && Math.abs(upperPct-lowerPct)/Math.max(Math.abs(upperPct),Math.abs(lowerPct)) < 0.55){
    type = upperPct > 0 ? 'ascending_channel' : 'descending_channel';
    label = upperPct > 0 ? 'Ascending Channel' : 'Descending Channel';
    explain = upperPct > 0
      ? 'Both swing highs and swing lows are rising at a similar pace — price is climbing inside two roughly parallel diagonal lines. The lower line is the trend\u2019s support; a close below it is the first sign the channel is breaking down.'
      : 'Both swing highs and swing lows are falling at a similar pace — price is declining inside two roughly parallel diagonal lines. The upper line is the trend\u2019s resistance; a close above it is the first sign the channel is breaking up, which is often when the largest reversal moves start (as in the Saipem-style chart pattern this mirrors).';
  } else if(!upperFlat && !lowerFlat && upperPct < -FLAT && lowerPct > FLAT){
    type = 'symmetrical_triangle'; label = 'Symmetrical Triangle';
    explain = 'Swing highs are falling while swing lows are rising — the two lines are converging toward a point (an ordinary, non-directional consolidation per Kirkpatrick & Dow). Whichever line price closes beyond first is read as the breakout direction; symmetrical triangles show no strong directional bias on their own.';
  } else if(upperFlat && !lowerFlat && lowerPct > FLAT){
    type = 'ascending_triangle'; label = 'Ascending Triangle';
    explain = 'A flat ceiling of roughly equal swing highs sits over a rising floor of swing lows — buyers are stepping in at progressively higher prices while sellers defend one fixed level. Classically read as more likely to break upward through the flat resistance than down.';
  } else if(!upperFlat && lowerFlat && upperPct < -FLAT){
    type = 'descending_triangle'; label = 'Descending Triangle';
    explain = 'A flat floor of roughly equal swing lows sits under a falling ceiling of swing highs — sellers are pressing in at progressively lower prices while buyers only defend one fixed level. Classically read as more likely to break downward through the flat support than up.';
  } else if(!upperFlat && !lowerFlat && Math.sign(upperPct)===Math.sign(lowerPct) && Math.abs(upperPct-lowerPct)/Math.max(Math.abs(upperPct),Math.abs(lowerPct)) >= 0.55){
    type = 'broadening'; label = 'Broadening / No Clean Geometry';
    explain = 'The upper and lower swing lines are diverging rather than running parallel or converging — price swings are getting wider, not narrower. This is a broadening formation: less reliable and less commonly tradeable than a clean channel or triangle.';
  }

  return { upperFit, lowerFit, type, label, explain };
}

function detectMARole(prices, ma, lookback=10){
  // Determine whether price is currently using the MA as a floor (support) or ceiling (resistance)
  const n = prices.length;
  if(n < lookback+2 || !ma || ma.length < n) return null;
  let touches = 0, aboveCount = 0, belowCount = 0;
  for(let i=n-lookback; i<n; i++){
    if(prices[i]==null || ma[i]==null) continue;
    const distPct = (prices[i]-ma[i]) / ma[i];
    if(Math.abs(distPct) < 0.02) touches++;
    if(prices[i] > ma[i]) aboveCount++; else belowCount++;
  }
  const lastPrice = prices[n-1], lastMA = ma[n-1];
  if(lastPrice==null || lastMA==null) return null;
  if(aboveCount >= lookback*0.7 && touches >= 1) return { role:'support', label:'Price using MA as support' };
  if(belowCount >= lookback*0.7 && touches >= 1) return { role:'resistance', label:'Price using MA as resistance' };
  return { role:'neutral', label:'No consistent MA support/resistance role right now' };
}

let candleZoomBars = 26; // default visible weekly bars
const CANDLE_ZOOM_MIN = 8, CANDLE_ZOOM_MAX = 260;

function zoomSlice(weekly){
  const n = weekly.c.length;
  const count = Math.min(candleZoomBars, n);
  const start = n - count;
  return {
    dates: weekly.dates.slice(start), o: weekly.o.slice(start), h: weekly.h.slice(start),
    l: weekly.l.slice(start), c: weekly.c.slice(start),
  };
}

// ============================================================
// CANDLESTICK PATTERN DETECTION — grounded in Nison, "Japanese
// Candlestick Charting Techniques" Ch. 4-5. Real body/shadow ratio
// thresholds and confirmation rules taken directly from the text.
// ============================================================
function priorTrendAt(weekly, i, lookback=4){
  // simple local-trend check: compare close several bars back to the bar just before i
  const j = Math.max(0, i - lookback);
  if(j >= i) return 'flat';
  const before = weekly.c[j], justBefore = weekly.c[i-1];
  if(before==null || justBefore==null) return 'flat';
  const chg = (justBefore - before) / before;
  if(chg > 0.015) return 'up';
  if(chg < -0.015) return 'down';
  return 'flat';
}

function candleGeom(weekly, i){
  const o=weekly.o[i], h=weekly.h[i], l=weekly.l[i], c=weekly.c[i];
  const body = Math.abs(c-o), range = (h-l) || 0.0001;
  const upperShadow = h - Math.max(o,c), lowerShadow = Math.min(o,c) - l;
  return { o,h,l,c, body, range, upperShadow, lowerShadow, isUp: c>=o };
}

function detectCandlePatterns(weekly, scanStart, scanEnd){
  const hits = [];
  for(let i=scanStart; i<=scanEnd; i++){
    if(i < 1 || i >= weekly.c.length) continue;
    const g = candleGeom(weekly, i);
    const trend = priorTrendAt(weekly, i);

    // --- Doji: real body negligible relative to the day's range ---
    if(g.body <= g.range*0.08 && g.range > 0){
      hits.push({ index:i, type:'doji', label:'Doji', bias:'neutral',
        explain:'Open and close are essentially equal — a "warning that the prior trend may be ending" (Nison, Ch.5). Not a trade signal by itself; watch the next bar for confirmation.' });
    }

    // --- Hammer / Hanging Man: umbrella line, body at top, lower shadow >= 2x body, minimal upper shadow ---
    if(g.body > 0 && g.lowerShadow >= g.body*2 && g.upperShadow <= g.body*0.5){
      if(trend === 'down'){
        hits.push({ index:i, type:'hammer', label:'Hammer', bias:'bullish',
          explain:'Long lower shadow at least twice the body, minimal upper shadow, appearing after a decline — Nison\u2019s three-criteria hammer. Doesn\u2019t strictly need confirmation, but risk is defined by the low of the hammer itself.' });
      } else if(trend === 'up'){
        const nextCloseBelow = (i+1 < weekly.c.length) ? weekly.c[i+1] < Math.min(g.o,g.c) : null;
        hits.push({ index:i, type:'hanging_man', label:'Hanging Man', bias:'bearish',
          explain:`Same shape as a hammer, but appearing after an advance — bearish, and per Nison should be confirmed by a lower close the following session. ${nextCloseBelow===true?'That confirmation has occurred.':nextCloseBelow===false?'That confirmation has not occurred yet — treat with caution.':'Not enough data yet to check confirmation.'}` });
      }
    }

    // --- Shooting Star / Inverted Hammer: upper shadow >= 2x body, minimal lower shadow ---
    if(g.body > 0 && g.upperShadow >= g.body*2 && g.lowerShadow <= g.body*0.5){
      if(trend === 'up'){
        hits.push({ index:i, type:'shooting_star', label:'Shooting Star', bias:'bearish',
          explain:'A long upper shadow with the body pinned near the low, after an advance — the market rejected higher prices within the session. Bearish, mirrors the hammer\u2019s logic inverted.' });
      } else if(trend === 'down'){
        hits.push({ index:i, type:'inverted_hammer', label:'Inverted Hammer', bias:'bullish',
          explain:'Same shape as a shooting star, but after a decline — a tentative bottoming signal that, per Nison, benefits from bullish confirmation the next session.' });
      }
    }

    // --- Two-candle patterns ---
    if(i >= 1){
      const p = candleGeom(weekly, i-1);
      const prevTrend = priorTrendAt(weekly, i-1);

      // Engulfing
      const engulfs = (Math.min(g.o,g.c) <= Math.min(p.o,p.c)) && (Math.max(g.o,g.c) >= Math.max(p.o,p.c)) && g.body > p.body*0.9;
      if(engulfs && g.isUp !== p.isUp){
        if(!g.isUp && p.isUp && prevTrend === 'up'){
          const resLevel = Math.max(g.h, p.h);
          hits.push({ index:i, type:'bearish_engulfing', label:'Bearish Engulfing', bias:'bearish',
            explain:`A black body fully engulfing the prior white body after an advance — "supply has overwhelmed demand" (Nison). The high of these two bars, ${resLevel.toFixed(1)}, becomes a resistance level worth watching on any later retest.`,
            srLevel: { type:'resistance', value: resLevel } });
        } else if(g.isUp && !p.isUp && prevTrend === 'down'){
          const supLevel = Math.min(g.l, p.l);
          hits.push({ index:i, type:'bullish_engulfing', label:'Bullish Engulfing', bias:'bullish',
            explain:`A white body fully engulfing the prior black body after a decline — buying pressure overwhelming selling. The low of these two bars, ${supLevel.toFixed(1)}, becomes a support level worth watching on any later retest.`,
            srLevel: { type:'support', value: supLevel } });
        }
      }

      // Dark Cloud Cover: prior strong white body, current opens above prior high, closes deep into prior body (below midpoint)
      if(!engulfs && p.isUp && !g.isUp && prevTrend === 'up'){
        const priorMid = Math.min(p.o,p.c) + p.body/2;
        if(g.o > p.h && g.c < priorMid && g.c > p.o){
          hits.push({ index:i, type:'dark_cloud', label:'Dark Cloud Cover', bias:'bearish',
            explain:'Opens above the prior session\u2019s high, then closes back down through more than half of the prior white body — the deeper the penetration, the stronger the reversal signal (Nison). The two-bar high acts as resistance.',
            srLevel: { type:'resistance', value: Math.max(g.h,p.h) } });
        }
      }

      // Piercing Line: prior strong black body, current opens below prior low, closes above midpoint of prior body
      if(!engulfs && !p.isUp && g.isUp && prevTrend === 'down'){
        const priorMid = Math.min(p.o,p.c) + p.body/2;
        if(g.o < p.l && g.c > priorMid && g.c < p.o){
          hits.push({ index:i, type:'piercing', label:'Piercing Line', bias:'bullish',
            explain:'Opens below the prior session\u2019s low, then closes back up through more than half of the prior black body — the bullish mirror of dark-cloud cover. The two-bar low acts as support.',
            srLevel: { type:'support', value: Math.min(g.l,p.l) } });
        }
      }

      // Harami: current body fully contained within prior body, opposite colors — indecision after a strong move
      const haramiFit = (Math.min(g.o,g.c) >= Math.min(p.o,p.c)) && (Math.max(g.o,g.c) <= Math.max(p.o,p.c)) && p.body > g.body*1.8 && p.body > p.range*0.4;
      if(haramiFit && g.isUp !== p.isUp){
        hits.push({ index:i, type:'harami', label:'Harami', bias:'neutral',
          explain:'A small body sitting entirely inside the prior session\u2019s large, opposite-colour body — the market has stalled after a strong move. Read as indecision, not a firm reversal signal on its own.' });
      }
    }
  }
  // most recent first, cap to avoid clutter
  return hits.sort((a,b)=>b.index-a.index).slice(0,3);
}

function drawCandles(fullWeekly){
  const canvas = document.getElementById('candleCanvas');
  const dpr = window.devicePixelRatio || 1;
  const cssW = canvas.clientWidth || canvas.parentElement.clientWidth;
  const cssH = 320;
  canvas.width = cssW * dpr; canvas.height = cssH * dpr;
  canvas.style.width = cssW+'px'; canvas.style.height = cssH+'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,cssW,cssH);

  // pattern detection always anchored to the true trailing ~6mo window, independent of zoom
  const pattern = detectPattern(fullWeekly);

  // display slice reflects the current zoom level
  const weekly = zoomSlice(fullWeekly);
  const fullLen = fullWeekly.c.length;
  const displayStartGlobal = fullLen - weekly.c.length;

  const n = weekly.c.length;
  if(n === 0) return;
  const padL = 46, padR = 10, padT = 14, padB = 20;
  const plotW = cssW - padL - padR;
  const plotH = cssH - padT - padB;

  const allVals = weekly.h.concat(weekly.l);
  const vMin = Math.min(...allVals), vMax = Math.max(...allVals);
  const vPad = (vMax - vMin) * 0.08 || 1;
  const yMin = vMin - vPad, yMax = vMax + vPad;
  const y = v => padT + plotH * (1 - (v - yMin) / (yMax - yMin));
  const slotW = plotW / n;
  const bodyW = Math.max(2, slotW * 0.55);
  const xAt = i => padL + slotW*i + slotW/2; // i = local display index

  // gridlines
  ctx.strokeStyle = '#1c242b'; ctx.lineWidth = 1; ctx.font = '10px IBM Plex Mono, monospace'; ctx.fillStyle = '#5a6b75';
  const gridLines = 5;
  for(let i=0;i<=gridLines;i++){
    const v = yMin + (yMax-yMin)*i/gridLines;
    const yy = y(v);
    ctx.beginPath(); ctx.moveTo(padL, yy); ctx.lineTo(cssW-padR, yy); ctx.stroke();
    ctx.fillText(v.toFixed(1), 2, yy+3);
  }

  // support / resistance lines — clipped to the visible (zoomed) window, but values always from the true recent pattern
  if(pattern){
    const rangeStartLocal = Math.max(0, Math.min(n-1, (pattern.offset - displayStartGlobal)));
    const rangeStartX = xAt(rangeStartLocal);
    ctx.setLineDash([5,4]);
    ctx.lineWidth = 1.3;
    ctx.strokeStyle = 'rgba(255,90,95,0.65)';
    ctx.beginPath(); ctx.moveTo(rangeStartX, y(pattern.resistance)); ctx.lineTo(cssW-padR, y(pattern.resistance)); ctx.stroke();
    ctx.strokeStyle = 'rgba(40,217,146,0.65)';
    ctx.beginPath(); ctx.moveTo(rangeStartX, y(pattern.support)); ctx.lineTo(cssW-padR, y(pattern.support)); ctx.stroke();
    ctx.setLineDash([]);

    ctx.font = '9.5px IBM Plex Mono, monospace';
    ctx.fillStyle = 'rgba(255,90,95,0.9)';
    ctx.fillText('Resistance '+pattern.resistance.toFixed(1), rangeStartX+4, y(pattern.resistance)-4);
    ctx.fillStyle = 'rgba(40,217,146,0.9)';
    ctx.fillText('Support '+pattern.support.toFixed(1), rangeStartX+4, y(pattern.support)+12);

    const fibToggleEl = document.getElementById('fibToggle');
    if(fibToggleEl && fibToggleEl.checked && pattern.fibLevels){
      ctx.setLineDash([2,3]);
      ctx.lineWidth = 1;
      pattern.fibLevels.forEach(f => {
        if(f.pct===0 || f.pct===1) return; // support/resistance already drawn above
        ctx.strokeStyle = 'rgba(255,178,0,0.45)';
        ctx.beginPath(); ctx.moveTo(rangeStartX, y(f.value)); ctx.lineTo(cssW-padR, y(f.value)); ctx.stroke();
        ctx.fillStyle = 'rgba(255,178,0,0.85)';
        ctx.font = '9px IBM Plex Mono, monospace';
        ctx.fillText((f.pct*100).toFixed(1)+'%', cssW-padR-32, y(f.value)-3);
      });
      ctx.setLineDash([]);
    }

    // diagonal trendlines: fitted through swing highs / swing lows, classified as channel or triangle
    const trendToggleEl = document.getElementById('trendlineToggle');
    if(trendToggleEl && trendToggleEl.checked && pattern.trendlines && pattern.trendlines.type){
      const tl = pattern.trendlines;
      const drawFittedLine = (fit, color) => {
        ctx.strokeStyle = color; ctx.lineWidth = 1.8;
        ctx.beginPath();
        let started = false;
        for(let L = rangeStartLocal; L <= n-1; L++){
          const g = L + displayStartGlobal;
          const wx = g - pattern.offset;
          const val = fit.slope*wx + fit.intercept;
          const xc = xAt(L), yc = y(val);
          if(!started){ ctx.moveTo(xc,yc); started = true; } else { ctx.lineTo(xc,yc); }
        }
        ctx.stroke();
      };
      drawFittedLine(tl.upperFit, 'rgba(255,90,95,0.85)');
      drawFittedLine(tl.lowerFit, 'rgba(40,217,146,0.85)');
      ctx.font = 'bold 10.5px IBM Plex Mono, monospace';
      ctx.fillStyle = '#7aa7ff';
      ctx.fillText(tl.label.toUpperCase(), rangeStartX+4, padT+12);
    }
  }

  // candles
  weekly.c.forEach((close,i) => {
    const open = weekly.o[i], high = weekly.h[i], low = weekly.l[i];
    const xc = xAt(i);
    const up = close >= open;
    ctx.strokeStyle = up ? '#28d992' : '#ff5a5f';
    ctx.fillStyle = up ? '#28d992' : '#ff5a5f';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(xc, y(high)); ctx.lineTo(xc, y(low)); ctx.stroke();
    const yOpen = y(open), yClose = y(close);
    const bodyTop = Math.min(yOpen,yClose), bodyH = Math.max(1, Math.abs(yClose-yOpen));
    ctx.fillRect(xc - bodyW/2, bodyTop, bodyW, bodyH);
  });

  // swing-point markers + double top/bottom connector (only if within the visible zoomed window)
  if(pattern){
    ctx.fillStyle = '#ffb200';
    pattern.highs.forEach(i => {
      const g = i + pattern.offset, L = g - displayStartGlobal;
      if(L < 0 || L >= n) return;
      const xc = xAt(L); ctx.beginPath(); ctx.arc(xc, y(fullWeekly.h[g]), 2.4, 0, 7); ctx.fill();
    });
    pattern.lows.forEach(i => {
      const g = i + pattern.offset, L = g - displayStartGlobal;
      if(L < 0 || L >= n) return;
      const xc = xAt(L); ctx.beginPath(); ctx.arc(xc, y(fullWeekly.l[g]), 2.4, 0, 7); ctx.fill();
    });

    if(pattern.doublePattern){
      const dp = pattern.doublePattern;
      const g1 = dp.levels[0]+pattern.offset, g2 = dp.levels[1]+pattern.offset;
      const L1 = g1 - displayStartGlobal, L2 = g2 - displayStartGlobal;
      if(L1 >= 0 && L2 < n){
        const isTop = dp.type === 'double_top';
        const yLevel = y(dp.value);
        const x1 = xAt(L1), x2 = xAt(L2);
        ctx.strokeStyle = isTop ? '#ff9ecb' : '#7aa7ff';
        ctx.setLineDash([2,2]); ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.moveTo(x1, yLevel); ctx.lineTo(x2, yLevel); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = isTop ? '#ff9ecb' : '#7aa7ff';
        ctx.font = 'bold 10px IBM Plex Mono, monospace';
        ctx.fillText(isTop ? 'DOUBLE TOP' : 'DOUBLE BOTTOM', x1, yLevel + (isTop ? -8 : 16));
      }
    }

    // breakout / breakdown annotation at the most recent bar (always the rightmost visible bar)
    const lastX = xAt(n-1);
    const lastY = y(weekly.c[n-1]);
    if(pattern.signal === 'resistance_breakout'){
      ctx.strokeStyle = '#28d992'; ctx.fillStyle = '#28d992';
      ctx.beginPath(); ctx.moveTo(lastX, lastY-8); ctx.lineTo(lastX-5, lastY+2); ctx.lineTo(lastX+5, lastY+2); ctx.closePath(); ctx.fill();
      ctx.font = 'bold 10px IBM Plex Mono, monospace';
      ctx.fillText('BREAKOUT', lastX-38, lastY-12);
    } else if(pattern.signal === 'support_breakdown'){
      ctx.strokeStyle = '#ff5a5f'; ctx.fillStyle = '#ff5a5f';
      ctx.beginPath(); ctx.moveTo(lastX, lastY+8); ctx.lineTo(lastX-5, lastY-2); ctx.lineTo(lastX+5, lastY-2); ctx.closePath(); ctx.fill();
      ctx.font = 'bold 10px IBM Plex Mono, monospace';
      ctx.fillText('BREAKDOWN', lastX-42, lastY+22);
    }
  }

  // Nison-style candlestick pattern markers (doji, hammer/hanging man, engulfing, dark-cloud, piercing, harami)
  const candleHits = detectCandlePatterns(fullWeekly, pattern ? pattern.offset : Math.max(0, fullLen-26), fullLen-1);
  const BIAS_COLOR = { bullish:'#28d992', bearish:'#ff5a5f', neutral:'#ffb200' };
  candleHits.forEach((hit, idx) => {
    const L = hit.index - displayStartGlobal;
    if(L < 0 || L >= n) return;
    const col = BIAS_COLOR[hit.bias];
    const xc = xAt(L);
    const hi = y(fullWeekly.h[hit.index]), lo = y(fullWeekly.l[hit.index]);
    const above = (hit.bias === 'bearish');
    const markY = above ? hi - 14 : lo + 14;
    ctx.strokeStyle = col; ctx.fillStyle = col;
    ctx.beginPath();
    if(above){ ctx.moveTo(xc, markY+6); ctx.lineTo(xc-4, markY-2); ctx.lineTo(xc+4, markY-2); }
    else { ctx.moveTo(xc, markY-6); ctx.lineTo(xc-4, markY+2); ctx.lineTo(xc+4, markY+2); }
    ctx.closePath(); ctx.fill();
    if(idx === 0){ // label only the most recent hit to avoid clutter
      ctx.font = 'bold 9.5px IBM Plex Mono, monospace';
      const label = hit.label.toUpperCase();
      ctx.fillText(label, Math.min(cssW-padR-label.length*6, Math.max(padL, xc - label.length*3)), above ? markY-9 : markY+18);
    }
    // most recent pattern's implied S/R level, if any
    if(idx === 0 && hit.srLevel){
      ctx.setLineDash([3,3]); ctx.lineWidth = 1;
      ctx.strokeStyle = hit.srLevel.type==='resistance' ? 'rgba(255,90,95,0.5)' : 'rgba(40,217,146,0.5)';
      ctx.beginPath(); ctx.moveTo(padL, y(hit.srLevel.value)); ctx.lineTo(cssW-padR, y(hit.srLevel.value)); ctx.stroke();
      ctx.setLineDash([]);
    }
  });

  // x labels (sparse)
  const labelEvery = Math.max(1, Math.round(n/7));
  ctx.fillStyle = '#5a6b75'; ctx.font = '10px IBM Plex Mono, monospace';
  weekly.dates.forEach((d,i) => {
    if(i % labelEvery === 0){
      const xc = xAt(i);
      ctx.fillText(d.slice(2,7), xc-14, cssH-4);
    }
  });

  return { pattern, candleHits };
}

const PATTERN_LABEL = {
  resistance_breakout: { text:'Resistance breakout — price just closed above its recent swing-high line', color:'var(--up)' },
  support_breakdown: { text:'Support breakdown — price just closed below its recent swing-low line', color:'var(--down)' },
  above_resistance: { text:'Trading above recent resistance', color:'var(--up)' },
  below_support: { text:'Trading below recent support', color:'var(--down)' },
  inside_range: { text:'Trading inside its recent support/resistance range', color:'var(--neutral)' },
};

function trendBadgeColor(trend){
  if(trend==='uptrend') return 'var(--up)';
  if(trend==='downtrend') return 'var(--down)';
  return 'var(--neutral)';
}
function momentumBadgeColor(m){
  if(m==='overbought') return 'var(--down)';
  if(m==='oversold') return 'var(--up)';
  return 'var(--neutral)';
}

function renderTechnical(ticker){
  const s = DATA.series[ticker];
  const snap = DATA.snapshot.find(f => (f.ticker+' Equity')===ticker);
  if(!s || !snap) return;
  techSelect.value = ticker;

  document.getElementById('techBadges').innerHTML = `
    <div class="tbadge" style="color:${trendBadgeColor(snap.trend)}; border-color:${trendBadgeColor(snap.trend)}55;">
      <span class="tbl">Trend</span>${snap.trend ? snap.trend.toUpperCase() : 'N/A'}
    </div>
    <div class="tbadge" style="color:${momentumBadgeColor(snap.momentum)}; border-color:${momentumBadgeColor(snap.momentum)}55;">
      <span class="tbl">RSI(14)</span>${snap.rsi===null?'—':snap.rsi} ${snap.momentum ? '· '+snap.momentum : ''}
    </div>
    <div class="tbadge" style="color:var(--ink-dim); border-color:var(--line);">
      <span class="tbl">20d Vol (ann.)</span>${snap.vol20===null?'—':snap.vol20+'%'}
    </div>
    <div class="tbadge" style="color:${colorForZ(snap.z)}; border-color:${colorForZ(snap.z)}55;">
      <span class="tbl">Mispricing Z</span>${snap.z===null?'—':(snap.z>0?'+':'')+snap.z}
    </div>
  `;

  const { pattern, candleHits } = drawCandles(s.weekly);
  const patLabelEl = document.getElementById('patternLabel');
  if(patLabelEl){
    if(pattern){
      const lbl = PATTERN_LABEL[pattern.signal] || PATTERN_LABEL.inside_range;
      let extra = '';
      if(pattern.doublePattern){
        extra = ` · possible ${pattern.doublePattern.type === 'double_top' ? 'double top' : 'double bottom'} forming near ${pattern.doublePattern.value.toFixed(1)}`;
      }
      let trendHtml = '';
      if(pattern.trendlines && pattern.trendlines.type){
        const tl = pattern.trendlines;
        trendHtml = `<div style="margin-top:8px; padding-top:8px; border-top:1px solid var(--line);">
          <span style="color:#7aa7ff; font-weight:700;">${tl.label}</span> detected from the swing highs/lows in the trailing window.
          <div style="color:var(--ink-dim); margin-top:4px;">${tl.explain}</div>
        </div>`;
      } else {
        trendHtml = `<div style="margin-top:8px; padding-top:8px; border-top:1px solid var(--line); color:var(--ink-faint);">No clean channel or triangle geometry detected in the current window — swing highs/lows aren't lining up into two consistent trendlines right now.</div>`;
      }
      let candleHtml = '';
      if(candleHits && candleHits.length){
        const BIAS_COLOR2 = { bullish:'var(--up)', bearish:'var(--down)', neutral:'var(--amber)' };
        candleHtml = `<div style="margin-top:8px; padding-top:8px; border-top:1px solid var(--line);">
          <div style="color:var(--ink-faint); font-family:var(--mono); font-size:9.5px; text-transform:uppercase; letter-spacing:.06em; margin-bottom:6px;">Recent Candlestick Signals (Nison)</div>
          ${candleHits.map(h => `<div style="margin-bottom:6px;"><span style="color:${BIAS_COLOR2[h.bias]}; font-weight:700;">${h.label}</span> <span style="color:var(--ink-faint); font-family:var(--mono); font-size:10px;">— ${s.weekly.dates[h.index]}</span><div style="color:var(--ink-dim); margin-top:2px;">${h.explain}</div></div>`).join('')}
        </div>`;
      }
      patLabelEl.innerHTML = `<span style="color:${lbl.color}; font-weight:600;">●</span> ${lbl.text}${extra}${trendHtml}${candleHtml}`;
    } else {
      patLabelEl.innerHTML = `<span style="color:var(--ink-faint);">Not enough weekly history yet to detect a range</span>`;
    }
  }

  const dates = DATA.dates.slice(s.startIdx);

  const maRole = detectMARole(s.price, s.ma50, 10);
  const maRoleEl = document.getElementById('maRoleLabel');
  if(maRoleEl){
    if(maRole){
      const col = maRole.role==='support' ? 'var(--up)' : (maRole.role==='resistance' ? 'var(--down)' : 'var(--neutral)');
      maRoleEl.innerHTML = `<span style="color:${col}; font-weight:600;">●</span> ${maRole.label} (based on the 50-day average over the last 10 sessions)`;
    } else {
      maRoleEl.innerHTML = `<span style="color:var(--ink-faint);">Not enough history yet to read a support/resistance role</span>`;
    }
  }

  if(maChart) maChart.destroy();
  if(bbChart) bbChart.destroy();
  if(rsiChart) rsiChart.destroy();

  maChart = new Chart(document.getElementById('maChart').getContext('2d'), {
    type:'line',
    data:{ labels:dates, datasets:[
      { data:s.price, borderColor:'#ffb200', backgroundColor:'transparent', fill:false },
      { data:s.ma50, borderColor:'#28d992', backgroundColor:'transparent', fill:false, borderDash:[2,2] },
      { data:s.ma200, borderColor:'#ff5a5f', backgroundColor:'transparent', fill:false, borderDash:[2,2] },
    ]},
    options: baseLineOptions()
  });

  bbChart = new Chart(document.getElementById('bbChart').getContext('2d'), {
    type:'line',
    data:{ labels:dates, datasets:[
      { data:s.bbUp, borderColor:'rgba(122,167,255,0.35)', backgroundColor:'rgba(122,167,255,0.06)', fill:'+1', pointRadius:0 },
      { data:s.bbMid, borderColor:'rgba(255,178,0,0.6)', backgroundColor:'transparent', fill:false, borderDash:[2,2] },
      { data:s.bbLo, borderColor:'rgba(122,167,255,0.35)', backgroundColor:'transparent', fill:false, pointRadius:0 },
      { data:s.price, borderColor:'#e7ecef', backgroundColor:'transparent', fill:false, borderWidth:1.2 },
    ]},
    options: baseLineOptions({ scales:{
      x:{ grid:{color:commonGridColor}, ticks:{maxTicksLimit:8, color:'#5a6b75'} },
      y:{ grid:{color:commonGridColor}, ticks:{color:'#5a6b75'} } } })
  });

  rsiChart = new Chart(document.getElementById('rsiChart').getContext('2d'), {
    type:'line',
    data:{ labels:dates, datasets:[{ data:s.rsi, borderColor:'#c792ea', backgroundColor:'rgba(199,146,234,0.08)', fill:true }]},
    options: baseLineOptions({ scales:{
      x:{ grid:{color:commonGridColor}, ticks:{maxTicksLimit:8, color:'#5a6b75'} },
      y:{ grid:{color:commonGridColor}, ticks:{color:'#5a6b75'}, suggestedMin:0, suggestedMax:100 } },
      plugins:{ legend:{display:false},
        tooltip:{ backgroundColor:'#151c22', borderColor:'#232c33', borderWidth:1, titleColor:'#e7ecef', bodyColor:'#c7d4da' } } })
  });
}

function readTag(snap){
  if(snap.trend==='uptrend' && snap.momentum==='oversold') return 'Uptrend, pulled back';
  if(snap.trend==='downtrend' && snap.momentum==='overbought') return 'Downtrend, extended';
  if(snap.trend==='uptrend' && snap.momentum==='overbought') return 'Uptrend, extended';
  if(snap.trend==='downtrend' && snap.momentum==='oversold') return 'Downtrend, oversold';
  if(snap.trend==='uptrend') return 'Uptrend, neutral RSI';
  if(snap.trend==='downtrend') return 'Downtrend, neutral RSI';
  return 'Mixed / no clear trend';
}

function buildScreen(){
  const body = document.getElementById('screenBody');
  body.innerHTML = DATA.snapshot.map((f,i) => {
    const s = DATA.series[f.ticker+' Equity'];
    const pat = s ? detectPattern(s.weekly) : null;
    const lbl = pat ? (PATTERN_LABEL[pat.signal] || PATTERN_LABEL.inside_range) : {text:'—', color:'var(--ink-faint)'};
    const dp = pat && pat.doublePattern ? (pat.doublePattern.type==='double_top'?' 2TOP':' 2BOT') : '';
    return `
    <tr data-ticker="${f.ticker} Equity">
      <td class="rank-num">${i+1}</td>
      <td class="name">${f.name} <span style="color:var(--ink-faint)">${f.ticker}</span></td>
      <td style="color:${trendBadgeColor(f.trend)}">${f.trend ? f.trend.toUpperCase() : '—'}</td>
      <td style="color:${momentumBadgeColor(f.momentum)}">${f.rsi===null?'—':f.rsi} ${f.momentum?'· '+f.momentum:''}</td>
      <td class="num">${f.vol20===null?'—':f.vol20+'%'}</td>
      <td class="num" style="color:${colorForZ(f.z)}; font-weight:600;">${f.z===null?'—':(f.z>0?'+':'')+f.z}</td>
      <td style="font-size:10.5px; color:${lbl.color};">${pat?pat.signal.replace('_',' '):'—'}${dp}</td>
      <td style="font-size:11px; color:var(--ink-faint);">${readTag(f)}</td>
    </tr>`;
  }).join('');
}

function synthesizeRead(f){
  const parts = [];
  if(f.trend === 'uptrend') parts.push('uptrend');
  else if(f.trend === 'downtrend') parts.push('downtrend');
  if(f.momentum === 'overbought') parts.push('overbought (RSI)');
  else if(f.momentum === 'oversold') parts.push('oversold (RSI)');
  const zAbs = f.z===null ? 0 : Math.abs(f.z);
  let zPhrase = 'mispricing signal muted';
  if(zAbs >= 2) zPhrase = (f.z>0?'strong positive':'strong negative')+' abnormal-return drift';
  else if(zAbs >= 0.75) zPhrase = (f.z>0?'mild positive':'mild negative')+' abnormal-return drift';
  parts.push(zPhrase);
  return parts.join(', ');
}

function buildSparkline(prices, w=200, h=44, color){
  const clean = prices.filter(p => p!==null && p!==undefined);
  if(clean.length < 2) return '';
  const tail = clean.slice(-30);
  const min = Math.min(...tail), max = Math.max(...tail);
  const range = (max-min) || 1;
  const step = w / (tail.length-1);
  const pts = tail.map((p,i) => `${(i*step).toFixed(1)},${(h - ((p-min)/range)*h*0.85 - h*0.075).toFixed(1)}`).join(' ');
  const lastUp = tail[tail.length-1] >= tail[0];
  const lineColor = color || (lastUp ? '#28d992' : '#ff5a5f');
  const areaPts = `0,${h} ${pts} ${w},${h}`;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" style="display:block;">
    <polyline points="${areaPts}" fill="${lineColor}22" stroke="none"/>
    <polyline points="${pts}" fill="none" stroke="${lineColor}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>`;
}

// cross-sample AAR (today) and CAAR (trailing 20d), computed once across all 26 firms
function computeCrossSample(){
  const masterIdx = DATA.dates.length;
  const todayIdx = masterIdx - 1;
  const arToday = [];
  Object.keys(DATA.series).forEach(ticker => {
    const lf = computeLiveFormula(ticker);
    if(lf && lf.lastAR !== null && !isNaN(lf.lastAR)) arToday.push(lf.lastAR);
  });
  const N = arToday.length;
  const AAR_today = N>0 ? arToday.reduce((a,b)=>a+b,0)/N : null;
  let sd = null, tstat = null;
  if(N>1){
    const variance = arToday.reduce((a,b)=>a+(b-AAR_today)**2,0)/(N-1);
    sd = Math.sqrt(variance);
    tstat = sd>0 ? (AAR_today / (sd/Math.sqrt(N))) : null;
  }
  const car20All = DATA.snapshot.map(f=>f.car20).filter(v=>v!==null && v!==undefined);
  const CAAR_20d = car20All.length>0 ? car20All.reduce((a,b)=>a+b,0)/car20All.length : null; // already in %
  return { N, AAR_today, sd, tstat, CAAR_20d, nCAAR:car20All.length };
}

// lag-1 autocorrelation of a firm's own AR series (diagnostic)
function autocorr(series, lag=1){
  const n = series.length;
  if(n < lag+10) return null;
  const mean = series.reduce((a,b)=>a+b,0)/n;
  let num=0, den=0;
  for(let i=0;i<n;i++){ den += (series[i]-mean)**2; }
  for(let i=0;i<n-lag;i++){ num += (series[i]-mean)*(series[i+lag]-mean); }
  return den>0 ? num/den : null;
}

// Wald-Wolfowitz runs test on the sign of recent abnormal returns — the same style of
// non-parametric check Fama (1970) discusses (citing Niederhoffer & Osborne) as a way to
// detect non-random anticipation/leakage ahead of an information event, distinct from
// autocorrelation. Applied here to the trailing window as a live "does this look anticipated" check.
function runsTest(series, tailN=10){
  const tail = series.slice(-tailN).filter(v => v !== 0);
  const n = tail.length;
  if(n < 6) return null;
  const signs = tail.map(v => v > 0);
  let runs = 1;
  for(let i=1;i<n;i++){ if(signs[i] !== signs[i-1]) runs++; }
  const n1 = signs.filter(s=>s).length, n2 = n - n1;
  if(n1===0 || n2===0) return { runs, n1, n2, expected:null, z:null };
  const expected = (2*n1*n2)/(n1+n2) + 1;
  const variance = (2*n1*n2*(2*n1*n2 - n1 - n2)) / (((n1+n2)**2)*(n1+n2-1));
  const sd = Math.sqrt(variance);
  const z = sd>0 ? (runs - expected)/sd : null;
  return { runs, n1, n2, expected, z };
}

function buildMethodologyLive(ticker){
  if(!ticker) return;
  methodFirmSelect.value = ticker;
  const snap = DATA.snapshot.find(f => (f.ticker+' Equity')===ticker);
  const s = DATA.series[ticker];
  if(!snap || !s) return;
  const lf = computeLiveFormula(ticker);
  const cross = computeCrossSample();
  const rho1 = lf ? autocorr(lf.arSeries, 1) : null;
  const rhoThreshold = lf ? 2.0/Math.sqrt(lf.n) : null;
  const runsRes = lf ? runsTest(lf.arSeries, 10) : null;

  const arrow = (label) => `<div class="flow-arrow"><span class="arrow-line"></span>↓ ${label} ↓<span class="arrow-line"></span></div>`;

      <div class="method-when">Input — computed for every firm-day before anything else</div>

    </div>`);
  sections.push(arrow('feeds into'));

  // 2. Market model

        <div class="cell"><div class="k">R<sub>m</sub> (SXEP, latest day)</div><div class="v" style="color:${lf&&lf.lastRm>=0?'var(--up)':'var(--down)'}">${lf?fmtPctSigned(lf.lastRm):'—'}</div></div>
      </div>
      <div class="method-interpret">${lf&&lf.beta!==null ? `${snap.name}'s β̂ of <b>${lf.beta.toFixed(2)}</b> means ` + (lf.beta>1.5 ? 'it swings noticeably harder than the sector — a 1% SXEP move tends to come with a much bigger move here.' : lf.beta<0.5 ? 'it barely reacts to sector-wide moves at all — unusually defensive for this space.' : 'it moves roughly in line with the sector — a fairly typical sensitivity for this kind of firm.') : 'Not enough history yet to estimate β̂.'} This β̂ and α̂ are what Step 3 subtracts from the actual return.</div>
    </div>`);
  sections.push(arrow('feeds into'));

  // 3. Abnormal return
  sections.push(`
    <div class="method-section">
      <h3><span class="method-step-num">3</span>Abnormal Return (AR) — the core quantity</h3>
      <div class="method-when">Computed fresh for the latest trading day</div>
      <div class="method-formula">AR<sub>i,t</sub> = R<sub>i,t</sub> − (α̂<sub>i</sub> + β̂<sub>i</sub>·R<sub>m,t</sub>)</div>
      <p class="method-why">The part of today's return the market model doesn't explain. Under the efficient market hypothesis (Fama, 1970), this should average to zero — a persistent non-zero AR is the signal this whole tracker is built to detect.</p>
      <div class="method-live">
        <div class="cell"><div class="k">AR (latest day)</div><div class="v" style="color:${lf&&lf.lastAR>=0?'var(--up)':'var(--down)'}; font-weight:700;">${lf?fmtPctSigned(lf.lastAR):'—'}</div></div>
      </div>
      <div class="method-interpret">${lf&&lf.lastAR!==null ? (Math.abs(lf.lastAR)<0.01 ? `A single day's AR of <b>${fmtPctSigned(lf.lastAR)}</b> is small — completely ordinary noise, not a signal on its own.` : `Today's AR of <b>${fmtPctSigned(lf.lastAR)}</b> is a larger single-day move than usual — worth noting, but one day still isn't enough to call it a trend. That's what Step 4 checks.`) : '—'} A single AR is never meaningful by itself; it only matters once you add many of them together, which is Step 4.</div>
    </div>`);
  sections.push(arrow('summed over 20 days →'));

  // 4. CAR
  sections.push(`
    <div class="method-section">
      <h3><span class="method-step-num">4</span>Cumulative Abnormal Return (CAR)</h3>
      <div class="method-when">Rolling 20-trading-day sum, updated daily</div>
      <div class="method-formula">CAR<sub>i</sub>(t₁,t₂) = Σ<sub>t=t₁</sub><sup>t₂</sup> AR<sub>i,t</sub></div>
      <p class="method-why">Sums daily AR over a window into one number — the drift this firm has shown over the last month, in either direction.</p>
      <div class="method-live">
        <div class="cell"><div class="k">CAR (20d)</div><div class="v" style="color:${(snap.car20??0)>=0?'var(--up)':'var(--down)'}; font-weight:700;">${snap.car20===null?'—':(snap.car20>0?'+':'')+snap.car20.toFixed(2)+'%'}</div></div>
      </div>
      <div class="method-interpret">${snap.car20!==null ? (Math.abs(snap.car20)<3 ? `A 20-day CAR of <b>${snap.car20.toFixed(1)}%</b> is unremarkable — within the range you'd expect from noise alone.` : Math.abs(snap.car20)<8 ? `A 20-day CAR of <b>${snap.car20.toFixed(1)}%</b> is a moderate, sustained drift — the kind of pattern worth checking against news for this firm.` : `A 20-day CAR of <b>${snap.car20.toFixed(1)}%</b> is a large, sustained move — this firm has drifted consistently ${snap.car20>0?'up':'down'} for a month, well beyond typical noise.`) : '—'}</div>
    </div>`);
  sections.push(arrow('averaged across 26 firms →'));

  // 5-6. AAR / CAAR cross-sample
  sections.push(`
    <div class="method-section">
      <h3><span class="method-step-num">5–6</span>Average &amp; Cumulative Average Abnormal Return — across all 26 firms</h3>
      <div class="method-when">Computed live across the whole sample, not just the selected firm</div>
      <div class="method-formula">AAR<sub>t</sub> = (1/N) Σᵢ AR<sub>i,t</sub> &nbsp;&nbsp;|&nbsp;&nbsp; CAAR(t₁,t₂) = Σ AAR<sub>t</sub></div>
      <p class="method-why">This is the headline sample-wide statistic: on average, across every firm in the tracker, is today's abnormal return positive or negative — and has that held over the last month? This is the exact same CAR formula from Step 4, just averaged across every firm instead of looked at one at a time.</p>
      <div class="method-live">
        <div class="cell"><div class="k">N (firms)</div><div class="v">${cross.N}</div></div>
        <div class="cell"><div class="k">AAR (today, cross-sample)</div><div class="v" style="color:${(cross.AAR_today??0)>=0?'var(--up)':'var(--down)'}">${cross.AAR_today!==null?fmtPctSigned(cross.AAR_today):'—'}</div></div>
        <div class="cell"><div class="k">CAAR (20d, cross-sample)</div><div class="v" style="color:${(cross.CAAR_20d??0)>=0?'var(--up)':'var(--down)'}">${cross.CAAR_20d!==null?(cross.CAAR_20d>0?'+':'')+cross.CAAR_20d.toFixed(2)+'%':'—'}</div></div>
      </div>
      <div class="method-interpret">${cross.AAR_today!==null ? (Math.abs(cross.AAR_today)<0.005 ? `Today's cross-sample AAR is close to zero — the sector overall is behaving normally, no shared shock visible today.` : `Today's cross-sample AAR of <b>${fmtPctSigned(cross.AAR_today)}</b> means the sector as a whole moved together today — likely something macro (oil price, rates, a sector-wide news item) rather than firm-specific.`) : '—'} Whether this number is more than noise is exactly what Steps 7–8 test.</div>
    </div>`);
  sections.push(arrow('tested for significance →'));

  // 7-8. t-statistics
  sections.push(`
    <div class="method-section">
      <h3><span class="method-step-num">7–8</span>Significance Test — Is Today's AAR Different from Zero?</h3>
      <div class="method-when">Cross-sectional t-test across the 26 firms, today — the same formula your dissertation cites (Brown &amp; Warner, 1985, Section 3.4.2)</div>
      <div class="method-formula">t = CAAR(t₁,t₂) / [ σ(CAAR) / √N ]&nbsp;&nbsp;<span style="font-size:11px; color:var(--ink-faint);">— applied here to a single day (AAR<sub>t</sub>) since no event window is loaded</span></div>
      <p class="method-why">Tests whether today's average abnormal return is large relative to how much firms disagree with each other — a genuine, live significance test, not a static example.</p>
      <div class="method-live">
        <div class="cell"><div class="k">Cross-sectional SD</div><div class="v">${cross.sd!==null?fmtPctSigned(cross.sd,3):'—'}</div></div>
        <div class="cell"><div class="k">t-statistic</div><div class="v" style="color:${cross.tstat!==null&&Math.abs(cross.tstat)>=2?'var(--amber)':'var(--ink-dim)'}; font-weight:700;">${cross.tstat!==null?cross.tstat.toFixed(2):'—'}</div></div>
        <div class="cell"><div class="k">Read</div><div class="v" style="font-size:11px;">${cross.tstat!==null?(Math.abs(cross.tstat)>=2?'Significant today':'Not significant today'):'—'}</div></div>
      </div>
      <div class="method-interpret">${cross.tstat!==null ? (Math.abs(cross.tstat)>=2 ? `|t| = <b>${Math.abs(cross.tstat).toFixed(2)}</b> is above 2 — today's average move is bigger than you'd expect from chance alone (roughly a &lt;5% chance of seeing this by luck). Worth taking seriously.` : `|t| = <b>${Math.abs(cross.tstat).toFixed(2)}</b> is below 2 — today's average move, even if non-zero, is small relative to how much firms normally disagree with each other. Statistically, this is indistinguishable from noise.`) : '—'} This is the same style of test the dissertation runs around real announcement dates — see Step 9.</div>
    </div>`);
  sections.push(arrow('same pipeline, applied around a real event date →'));

  // 9. H1/H2 -- real event data where we have it (5 firms), illustrative demo otherwise
  const firmEvents = (typeof EVENT_DATA !== 'undefined')
    ? EVENT_DATA.study.filter(r => r.firm.toLowerCase().replace('\u00f8','o') === snap.name.toLowerCase().replace('\u00f8','o'))
    : [];
  if(firmEvents.length > 0){
    const mostRecent = firmEvents.slice().sort((a,b)=> a.event_date<b.event_date?1:-1)[0];
    const others = firmEvents.length - 1;
    const fmtCar = v => v===null||v===undefined ? '\u2014' : `${v>=0?'+':''}${v.toFixed(2)}%`;
    sections.push(`
      <div class="method-section" style="border-left:3px solid #28d992;">
        <h3><span class="method-step-num" style="background:#28d992; color:#0a0d10;">9</span>H1 / H2 Windows <span class="illustrative-tag" style="color:#28d992; border-color:#28d99944;">real event</span></h3>
        <div class="method-when">A genuine verified green bond issuance by ${snap.name} on <b>${mostRecent.event_date}</b> (${mostRecent.currency} ${(parseFloat(mostRecent.amount)/1e6).toFixed(0)}M) -- not a placeholder day</div>
        <div class="method-formula">H1: CAAR(\u22121,+1) &nbsp;&nbsp;|&nbsp;&nbsp; H2: CAAR(0,+5) and CAAR(\u22125,+10) vs. CAAR(\u22121,+1)</div>
        <p class="method-why">These are three of the exact six windows your dissertation tests (Section 3.4.2), computed around this firm's actual announcement date using the same 120-day market model as Steps 1-8 above.${others>0?` ${snap.name} has ${others} other verified event${others>1?'s':''} in this tracker's data -- see the Green Bond Events tab for the full set, all six windows, and the pooled CAAR across all of them.`:''}</p>
        <div class="method-live">
          <div class="cell"><div class="k">CAAR(\u22121,+1)</div><div class="v" style="color:${mostRecent['CAR(-1,+1)']>=0?'var(--up)':'var(--down)'}; font-weight:700;">${fmtCar(mostRecent['CAR(-1,+1)'])}</div></div>
          <div class="cell"><div class="k">CAAR(0,+5)</div><div class="v" style="color:${mostRecent['CAR(0,+5)']>=0?'var(--up)':'var(--down)'};">${fmtCar(mostRecent['CAR(0,+5)'])}</div></div>
          <div class="cell"><div class="k">CAAR(\u22125,+10)</div><div class="v" style="color:${mostRecent['CAR(-5,+10)']>=0?'var(--up)':'var(--down)'};">${fmtCar(mostRecent['CAR(-5,+10)'])}</div></div>
        </div>
        <div class="method-interpret">${(() => {
          const a = mostRecent['CAR(-1,+1)'], b5 = mostRecent['CAR(0,+5)'], b10 = mostRecent['CAR(-5,+10)'];
          if(a===null||b5===null||b10===null) return 'Incomplete window data for this event.';
          const growing = Math.abs(b10) > Math.abs(a)*1.3 && Math.sign(b10)===Math.sign(a);
          return growing
            ? `The effect grows as the window widens (${fmtCar(a)} \u2192 ${fmtCar(b10)}), same direction -- consistent with delayed incorporation rather than an instant, one-day reaction (supports H2's underreaction story for this specific event).`
            : `The wider window doesn't add much beyond the immediate reaction (${fmtCar(a)} vs ${fmtCar(b10)}) -- more consistent with the market pricing this in close to immediately (H1 holds cleanly; less support for H2 from this single event).`;
        })()} One event is not a test -- this is illustrative of what a real result looks like, not a conclusion; the aggregate 90-event CAAR (all six windows, plus a Patell test) on the Green Bond Events tab is the actual evidence.</div>
      </div>`);
  } else {
    sections.push(`
    <div class="method-section">
      <h3><span class="method-step-num">9</span>H1 / H2 Windows <span class="illustrative-tag">illustrative</span></h3>
      <div class="method-when">Demonstration only -- no verified event exists yet for ${snap.name} in this tracker's data, so "day 0" below is just the most recent trading day, not a real transition-finance announcement. Check the Green Bond Events tab -- Neste, Nordex, \u00d8rsted, PKN Orlen, Snam and Siemens Energy have real events wired in here instead of this demo (plus EDP, Enel, Engie, Iberdrola, RWE and SSE, though those aren't in this tab's firm selector).</div>
      <div class="method-formula">H1: CAAR(\u22121,+1) &nbsp;&nbsp;|&nbsp;&nbsp; H2: CAAR(0,+5) and CAAR(0,+10) vs. CAAR(\u22121,+1)</div>
      <p class="method-why">These are the exact windows your dissertation tests (Section 3.4.2 lists [\u22121,+1], [0,+1], [0,+5], [\u22122,+5], [\u22125,+10], [\u221210,+10]). H2 as written asks whether the wider windows [0,+5]/[0,+10] show a <i>larger</i> cumulative effect than the narrow [\u22121,+1] window -- note these windows share days 0 and +1, so H2 is testing whether the effect <i>grows</i> once the immediate window is widened, not testing a strictly separate later period. Worth keeping in mind if you want to distinguish "growing drift" from "the same reaction just measured over more days."</p>
      <div class="method-live">
        <div class="cell"><div class="k">CAAR(\u22121,+1) equivalent</div><div class="v">${(() => { const p=s.price; const n=p.length; if(n<4) return '\u2014'; const w=p.slice(n-4); let sum=0,c=0; for(let i=1;i<w.length;i++){ if(w[i]&&w[i-1]){sum+=Math.log(w[i]/w[i-1]); c++;} } return c? fmtPctSigned(sum):'\u2014'; })()}</div></div>
        <div class="cell"><div class="k">CAAR(0,+5) equivalent</div><div class="v">${(() => { const p=s.price; const n=p.length; if(n<7) return '\u2014'; const w=p.slice(n-7); let sum=0,c=0; for(let i=1;i<w.length;i++){ if(w[i]&&w[i-1]){sum+=Math.log(w[i]/w[i-1]); c++;} } return c? fmtPctSigned(sum):'\u2014'; })()}</div></div>
        <div class="cell"><div class="k">CAAR(0,+10) equivalent</div><div class="v">${(() => { const p=s.price; const n=p.length; if(n<12) return '\u2014'; const w=p.slice(n-12); let sum=0,c=0; for(let i=1;i<w.length;i++){ if(w[i]&&w[i-1]){sum+=Math.log(w[i]/w[i-1]); c++;} } return c? fmtPctSigned(sum):'\u2014'; })()}</div></div>
      </div>
      <div class="method-interpret"><b>How to read a real H1/H2 result once you have event dates:</b> CAAR(0,+5) and CAAR(0,+10) both meaningfully exceed CAAR(\u22121,+1), same direction \u2192 consistent with delayed incorporation (supports H2). CAAR(0,+5)/CAAR(0,+10) roughly equal to CAAR(\u22121,+1) \u2192 the wider window is adding nothing new, consistent with instantaneous, efficient pricing (H1 holds, H2 doesn't). All three near zero \u2192 market didn't treat the announcement as informative at all.</div>
    </div>`);
  }

  sections.push(`
    <div class="method-section" style="border-left:3px solid #7aa7ff;">
      <h3 style="color:#7aa7ff;">A caveat worth writing into your H1 discussion: pre-event drift isn't necessarily leakage</h3>
      <div class="method-when">Interpretive note, grounded in Fama (1970) §III.B.1 discussing Fama, Fisher, Jensen &amp; Roll (1969)</div>
      <p class="method-why">FFJR found cumulative average residuals for stock splits rising steadily for roughly <b>29 months before</b> the split date — and their explanation wasn't information leakage. It was self-selection: firms tend to split their shares during "abnormally good times," when prices have already risen on genuinely improved earnings prospects the firm already had. The split announcement doesn't cause the pre-event drift; the same good fortune that led to strong performance is what led management to announce the split in the first place.</p>
      <p class="method-why">The same ambiguity applies directly to your transition-finance announcements. If you observe positive CAR in the days <i>before</i> a green bond or transition-strategy announcement, that's consistent with two different stories that your event-study design alone cannot distinguish: (1) information about the coming announcement genuinely leaked early, or (2) firms choose <i>when</i> to announce transition financing partly based on already having the balance-sheet strength and market confidence to commit capital — i.e., the announcement follows the good news rather than causing it. Worth a paragraph in your H1 discussion acknowledging this, rather than defaulting to "leakage" as the only explanation for any pre-event drift you find.</p>
    </div>`);
  sections.push(arrow('what predicts the size of the reaction? →'));

  // 10. H3
  sections.push(`
    <div class="method-section">
      <h3><span class="method-step-num">10</span>H3 — Cross-Sectional Regression <span class="illustrative-tag">not live-computable</span></h3>
      <div class="method-when">Needs certification / first-issuance / issuance-size data this tracker doesn't have</div>
      <div class="method-formula">CAR<sub>i</sub> = b₀ + b₁·Certification<sub>i</sub> + b₂·FirstIssuance<sub>i</sub> + b₃·ln(Size<sub>i</sub>) + controls + ε<sub>i</sub></div>
      <p class="method-why">This regression needs deal-level data — which bonds were certified, which issuers were first-timers — that isn't part of a price extract. The Fundamentals (WRDS) tab's Price-to-Book data is the kind of firm-level control (X<sub>i</sub>) this regression would use, but the actual left-hand-side moderators require an event/deal database. The CAR<sub>i</sub> on the left is exactly the same number produced in Step 4 — this step doesn't introduce a new dependent variable, it just asks what explains it firm-to-firm.</p>
    </div>`);
  sections.push(arrow('robustness check on the whole pipeline →'));

  // 11. Autocorrelation diagnostic
  sections.push(`
    <div class="method-section">
      <h3><span class="method-step-num">11</span>Diagnostic — Autocorrelation in ${snap.name}'s Abnormal Returns</h3>
      <div class="method-when">Lag-1 autocorrelation over the same 120-day estimation window used in Step 2</div>
      <div class="method-formula">|ρ̂<sub>l</sub>| &gt; 2.0 / √(T − l)</div>
      <p class="method-why">Checks whether this firm's own abnormal returns are serially correlated — relevant to whether event-clustering corrections would be needed in the full dissertation test.</p>
      <div class="method-live">
        <div class="cell"><div class="k">ρ̂ (lag 1)</div><div class="v">${rho1!==null?rho1.toFixed(3):'—'}</div></div>
        <div class="cell"><div class="k">Threshold</div><div class="v">${rhoThreshold!==null?rhoThreshold.toFixed(3):'—'}</div></div>
        <div class="cell"><div class="k">Read</div><div class="v" style="font-size:11px;">${(rho1!==null&&rhoThreshold!==null)?(Math.abs(rho1)>rhoThreshold?'Significant autocorrelation':'No significant autocorrelation'):'—'}</div></div>
      </div>
      <div class="method-interpret">${(rho1!==null&&rhoThreshold!==null) ? (Math.abs(rho1)>rhoThreshold ? `ρ̂ = <b>${rho1.toFixed(2)}</b> exceeds the threshold — one day's AR has some power to predict the next day's, which is itself a mild sign of underreaction, and means calendar-clustering corrections (Step 9's real-world version) matter more.` : `ρ̂ = <b>${rho1.toFixed(2)}</b> is inside the threshold — no meaningful day-to-day predictability in this firm's abnormal returns, which is what efficient pricing would predict.`) : '—'}</div>
    </div>`);
  sections.push(arrow('a second, independent check — anticipation, not correlation →'));

  // 12. Runs test — Waud-style anticipation/leakage check, distinct from autocorrelation
  sections.push(`
    <div class="method-section">
      <h3><span class="method-step-num">12</span>Diagnostic — Runs Test: Does Recent AR Look Anticipated?</h3>
      <div class="method-when">Wald-Wolfowitz runs test on the sign of ${snap.name}'s trailing 10 daily abnormal returns</div>
      <div class="method-formula">z = (runs − E[runs]) / SD[runs]&nbsp;&nbsp;<span style="font-size:11px; color:var(--ink-faint);">— Fama (1970) discusses this exact test (citing Niederhoffer &amp; Osborne) as a check for non-random anticipation ahead of an information event</span></div>
      <p class="method-why">This is a different question from Step 11's autocorrelation check. Autocorrelation asks "does yesterday's AR predict today's." A runs test asks something more specific: are the +/− signs of AR clustering into unusually long same-sign streaks, the kind of pattern you'd expect if the market were gradually front-running information before it's formally announced (Waud's technique, as discussed in Fama 1970 §III.B.2). Too <i>few</i> runs (long streaks) can suggest anticipation; a normal or high number of runs is consistent with day-to-day pricing being essentially unpredictable in sign.</p>
      <div class="method-live">
        <div class="cell"><div class="k">Observed runs</div><div class="v">${runsRes && runsRes.expected!==null ? runsRes.runs : '—'}</div></div>
        <div class="cell"><div class="k">Expected runs</div><div class="v">${runsRes && runsRes.expected!==null ? runsRes.expected.toFixed(1) : '—'}</div></div>
        <div class="cell"><div class="k">z-statistic</div><div class="v" style="color:${runsRes&&runsRes.z!==null&&Math.abs(runsRes.z)>=2?'var(--amber)':'var(--ink-dim)'}; font-weight:700;">${runsRes && runsRes.z!==null ? runsRes.z.toFixed(2) : '—'}</div></div>
      </div>
      <div class="method-interpret">${runsRes && runsRes.z!==null ? (runsRes.z <= -2 ? `z = <b>${runsRes.z.toFixed(2)}</b> — noticeably fewer runs than expected under randomness. The sign of AR has been streaking longer than chance would predict over the last 10 sessions — worth a closer look at whether something was being priced in gradually before any public announcement.` : Math.abs(runsRes.z) < 2 ? `z = <b>${runsRes.z.toFixed(2)}</b> — within the range expected under randomness. No evidence of anticipatory streaking in the sign of AR right now.` : `z = <b>${runsRes.z.toFixed(2)}</b> — more runs (more sign-switching) than expected, the opposite of an anticipation pattern.`) : 'Not enough recent history, or too few sign changes, to run this test right now.'}</div>
    </div>`);
  sections.push(arrow('putting steps 1–12 together →'));

  // 13. Outcome — synthesized current read
  const z = snap.z;
  const hasAutocorr = (rho1!==null && rhoThreshold!==null && Math.abs(rho1)>rhoThreshold);
  let verdictText, verdictColor;
  if(z===null){
    verdictText = 'Not enough history yet to form a read for this firm.';
    verdictColor = 'var(--ink-faint)';
  } else if(Math.abs(z) >= 2){
    verdictText = hasAutocorr
      ? `Both an unusually large 20-day drift (z = ${z.toFixed(2)}) <b>and</b> day-to-day predictability in its abnormal returns. Together, this combination is the closest this tracker gets to the underreaction/mispricing signature (H2) — worth checking the News tab for what's actually happening at ${snap.name} right now.`
      : `An unusually large 20-day drift (z = ${z.toFixed(2)}), but no evidence of continued day-to-day predictability. Reads more like a single re-pricing event than gradual underreaction — check whether it lines up with a specific, one-off announcement rather than assuming ongoing drift.`;
    verdictColor = 'var(--down)';
  } else if(Math.abs(z) >= 0.75){
    verdictText = `A mild, non-extreme drift (z = ${z.toFixed(2)}) — not nothing, but not the kind of signal that clears a conventional significance bar on its own.`;
    verdictColor = '#f0c078';
  } else {
    verdictText = `No unusual drift right now (z = ${z.toFixed(2)}) — this firm's recent abnormal returns look statistically ordinary, consistent with efficient, prompt pricing rather than any detectable mispricing.`;
    verdictColor = 'var(--up)';
  }
  let macroNote = '';
  if(cross.AAR_today!==null && lf && lf.lastAR!==null && Math.abs(cross.AAR_today)>0.003 && (cross.AAR_today>0)===(lf.lastAR>0)){
    macroNote = `<p class="method-why">Worth noting: today's cross-sample AAR moved the same direction as ${snap.name}'s own AR — part of today's move may be sector-wide (check the Brent/TTF overlay on the Live Tracker chart) rather than specific to this firm.</p>`;
  }
  sections.push(`
    <div class="method-section" style="margin-bottom:0; border-color:${verdictColor}55;">
      <h3><span class="method-step-num" style="background:${verdictColor}; color:#0a0d10;">13</span>Outcome — Current Read for ${snap.name}</h3>
      <div class="method-when">Synthesizes Steps 4, 7–8, 11 and 12 above · recalculates automatically whenever you select a different firm here or in the Live Tracker</div>
      <div class="method-interpret" style="border-left-color:${verdictColor};">${verdictText}</div>
      ${macroNote}
      <p class="method-note" style="margin-top:10px;">This is a live descriptive read of the data as it stands right now, not a recommendation — the same caveats as the rest of this tracker apply (in-sample, no event calendar loaded, no transaction costs). It will change automatically as the underlying price data changes or as you switch firms.</p>
    </div>`);

  document.getElementById('methodSections').innerHTML = sections.join('');
}

// ============================================================
// GREEN BOND EVENTS — real verified data, real preliminary event study
// ============================================================
let _eventsBuilt = false;
function buildGreenBondEvents(){
  if(_eventsBuilt) return;
  _eventsBuilt = true;

  // --- aggregate summary table: all 6 dissertation windows, plain t-test + Patell Z ---
  const windows = ['CAR(-1,+1)','CAR(0,+1)','CAR(0,+5)','CAR(-2,+5)','CAR(-5,+10)','CAR(-10,+10)'];
  const summaryBody = document.querySelector('#eventStudySummaryTable tbody');
  summaryBody.innerHTML = windows.map(w => {
    const scarKey = w.replace('CAR','SCAR');
    const vals = EVENT_DATA.study.map(r => r[w]).filter(v => v !== null && v !== undefined);
    const scars = EVENT_DATA.study.map(r => r[scarKey]).filter(v => v !== null && v !== undefined);
    const n = vals.length;
    const mean = vals.reduce((a,b)=>a+b,0)/n;
    const sd = Math.sqrt(vals.reduce((a,b)=>a+(b-mean)**2,0)/(n-1));
    const t = sd>0 ? mean/(sd/Math.sqrt(n)) : null;
    const patellZ = scars.length ? scars.reduce((a,b)=>a+b,0)/Math.sqrt(scars.length) : null;
    const pos = vals.filter(v=>v>0).length;
    const sigT = t!==null && Math.abs(t)>=2;
    const sigP = patellZ!==null && Math.abs(patellZ)>=2;
    const bothSig = sigT && sigP;
    const eitherMarg = (t!==null && Math.abs(t)>=1.5) || (patellZ!==null && Math.abs(patellZ)>=1.5);
    const read = bothSig ? 'Significant (both tests)' : eitherMarg ? 'Marginal' : 'Not significant';
    const readColor = bothSig ? 'var(--down)' : eitherMarg ? 'var(--amber)' : 'var(--ink-faint)';
    return `<tr>
      <td style="font-weight:600;">${w.replace('CAR','CAAR')}</td>
      <td>${n}</td>
      <td style="color:${mean>=0?'var(--up)':'var(--down)'}; font-weight:600;">${mean>=0?'+':''}${mean.toFixed(2)}%</td>
      <td>${t!==null?t.toFixed(2):'—'}</td>
      <td>${patellZ!==null?patellZ.toFixed(2):'—'}</td>
      <td>${pos}/${n}</td>
      <td style="color:${readColor};">${read}</td>
    </tr>`;
  }).join('');

  // --- per-event detail table: all 6 windows ---
  const detailBody = document.getElementById('eventStudyDetailBody');
  detailBody.innerHTML = EVENT_DATA.study.slice().sort((a,b)=>a.event_date<b.event_date?1:-1).map(r => {
    const fmtCar = v => v===null||v===undefined ? '—' : `<span style="color:${v>=0?'var(--up)':'var(--down)'};">${v>=0?'+':''}${v.toFixed(2)}%</span>`;
    const amt = r.amount ? (parseFloat(r.amount)/1e6).toFixed(0)+'M '+r.currency : '—';
    return `<tr>
      <td class="name">${r.firm}</td>
      <td style="font-family:var(--mono); font-size:11px;">${r.event_date}</td>
      <td style="font-family:var(--mono); font-size:11px;">${amt}</td>
      <td class="num">${fmtCar(r['CAR(-1,+1)'])}</td>
      <td class="num">${fmtCar(r['CAR(0,+1)'])}</td>
      <td class="num">${fmtCar(r['CAR(0,+5)'])}</td>
      <td class="num">${fmtCar(r['CAR(-2,+5)'])}</td>
      <td class="num">${fmtCar(r['CAR(-5,+10)'])}</td>
      <td class="num">${fmtCar(r['CAR(-10,+10)'])}</td>
    </tr>`;
  }).join('');

  // --- full 147-event list, grouped by firm ---
  const PRICE_AVAILABLE = new Set(['Neste','Nordex','Orsted','PKN Orlen','Snam','EDP','Enel','Engie','Iberdrola','RWE','SSE','Siemens Energy']);
  const fullBody = document.getElementById('fullEventListBody');
  const sorted = EVENT_DATA.events.slice().sort((a,b) => a.tracker_firm.localeCompare(b.tracker_firm) || (a.issue_date<b.issue_date?1:-1));
  fullBody.innerHTML = sorted.map(e => {
    const hasPrice = PRICE_AVAILABLE.has(e.tracker_firm);
    const amt = e.amount_issued ? (e.amount_issued/1e6).toFixed(0)+'M' : '—';
    const amtEur = e.amount_issued_eur ? (e.amount_issued_eur/1e6).toFixed(0)+'M' : '—';
    const fxTitle = (e.currency !== 'EUR' && e.fx_rate_to_eur) ? ` title="Converted at annual-average ${e.currency}->EUR rate of ${e.fx_rate_to_eur} for ${e.issue_date.split('/')[2]} -- see FX methodology note below"` : '';
    return `<tr>
      <td class="name">${e.tracker_firm}${hasPrice?'':' <span style="color:var(--ink-faint); font-size:10px;">(no price data)</span>'}</td>
      <td style="font-size:11px; color:var(--ink-dim);">${e.bloomberg_issuer_name}</td>
      <td style="font-family:var(--mono); font-size:11px;">${e.issue_date}</td>
      <td style="font-family:var(--mono); font-size:11px;">${e.currency}</td>
      <td class="num" style="font-family:var(--mono); font-size:11px;">${amt}</td>
      <td class="num" style="font-family:var(--mono); font-size:11px;"${fxTitle}>${amtEur}${e.currency!=='EUR'?' <span style="color:var(--ink-faint);">*</span>':''}</td>
      <td style="font-size:11px; color:var(--ink-dim);">${e.use_of_proceeds || '\u2014 (not in this data pull)'}</td>
    </tr>`;
  }).join('');
}
</script>
</body>
</html>
